<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Promo — fine-video-as-code</title>
  <style>
    /* Template skin. Layout, timing and motion live in _engine.js. */
    .pr-backdrop {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        linear-gradient(115deg, var(--fv-brand-soft) 0%, transparent 42%),
        linear-gradient(300deg, var(--fv-accent-soft) 0%, transparent 38%);
    }
    .pr-scene[data-layout="title"] .fv-heading { font-size: var(--fv-text-4xl); letter-spacing: -0.03em; }
    .pr-scene[data-layout="title"] .fv-heading em {
      font-style: normal;
      background: linear-gradient(100deg, var(--fv-brand), var(--fv-accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .pr-strip {
      position: absolute; left: 0; right: 0; bottom: var(--fv-subbar-min);
      height: 1px; background: linear-gradient(90deg, transparent, var(--fv-border-strong), transparent);
    }
    .pr-tag {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: var(--fv-text-xs); letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--fv-text-faint);
    }
    .pr-tag::before {
      content: ""; width: 34px; height: 2px; background: var(--fv-accent);
    }
  </style>
</head>
<body>
  <div class="pr-backdrop"></div>
  <div class="pr-strip"></div>
  <div class="fv-stage" id="stage"></div>
  <script src="_engine.js"></script>
  <script src="illustrations/icons.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    E.init();
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    document.documentElement.lang = data.language === 'en' ? 'en' : 'vi';
    E.applyBrand(data.brand || {});
    if (isDeterministic) E.freezeTransitions();

    const stage = document.getElementById('stage');
    const sceneEls = E.buildStage(stage, data.scenes, (s, i, total) =>
      E.renderScene(s, i, total, { meta: data, template: 'promo' })
    );

    E.applyDecoration(document.body, {
      particles: { count: 28, colors: ['var(--fv-brand)', 'var(--fv-accent)', '#ffffff'] },
    });

    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;

    if (isRender && !isDeterministic) {
      E.runRealtime(seek, timeline.totalMs, () => { window.__renderDone = true; });
    } else if (!isRender && !isDeterministic) {
      const t0 = performance.now();
      (function tick() {
        const t = performance.now() - t0;
        if (t >= timeline.totalMs) return;
        seek(t);
        requestAnimationFrame(tick);
      })();
    }
  }
  main();
  </script>
</body>
</html>
