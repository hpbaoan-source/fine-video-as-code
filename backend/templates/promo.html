<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Promo — fine-video-as-code</title>
  <style>
    :root {
      --brand: #3B82F6;
      --accent: #F59E0B;
      --text: #FFFFFF;
      --dim: #D1D5DB;
      --bg: #0a0c10;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    body { position: relative; }
    .stage { position: absolute; inset: 0; }
    .topic { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 8px; color: var(--accent); text-transform: uppercase; font-weight: 600; opacity: 0; transition: opacity 0.5s; z-index: 10; }
    .topic.show { opacity: 1; }
    .pulse { position: absolute; top: 50%; left: 50%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; background: radial-gradient(circle, var(--brand) 0%, transparent 70%); opacity: 0.18; transition: transform 0.6s ease-in-out, opacity 0.4s; pointer-events: none; }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
    .scene .heading { font-size: 130px; font-weight: 800; line-height: 1.0; text-align: center; max-width: 1700px; opacity: 0; transform: scale(0.7); transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .scene .voiceover { font-size: 42px; color: var(--dim); margin-top: 50px; text-align: center; max-width: 1500px; line-height: 1.5; opacity: 0; transition: opacity 0.5s ease-out 0.2s; }
    .on-screen { font-size: 64px; color: var(--brand); margin-top: 30px; font-weight: 700; text-align: center; opacity: 0; transition: opacity 0.5s ease-out 0.3s; }
    .cta { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%) scale(0.9); background: var(--accent); color: var(--bg); font-size: 28px; font-weight: 800; padding: 22px 60px; border-radius: 50px; letter-spacing: 3px; opacity: 0; transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .scene.active { opacity: 1; }
    .scene.active .heading { opacity: 1; transform: scale(1); }
    .scene.active .voiceover { opacity: 1; }
    .scene.active .on-screen { opacity: 1; }
    .scene.active .cta { opacity: 1; transform: translateX(-50%) scale(1); }
    .scene.exiting { opacity: 0; }
    .scene.exiting .heading { transform: scale(1.15); transition: opacity 0.4s ease-in, transform 0.4s ease-in; }
    .hero { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
    .hero .pulse-ring { position: absolute; width: 320px; height: 320px; border-radius: 50%; border: 3px solid var(--brand); animation: pulse-ring 2.2s ease-out infinite; opacity: 0; }
    .hero .pulse-ring.r2 { animation-delay: 1.1s; }
    .hero .icon-bubble { width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, transparent 70%); display: flex; align-items: center; justify-content: center; color: var(--brand); }
    .scene.active .icon-bubble { animation: glow 3s ease-in-out infinite; }
    .scene.active .pulse-ring { opacity: 0.5; }
    .stat-row { display: flex; gap: 80px; margin-top: 50px; opacity: 0; transition: opacity 0.5s ease-out 0.4s; }
    .scene.active .stat-row { opacity: 1; }
    .stat { text-align: center; }
    .stat-num { font-size: 72px; font-weight: 800; color: var(--accent); line-height: 1; }
    .stat-lbl { font-size: 22px; color: var(--dim); margin-top: 8px; letter-spacing: 2px; text-transform: uppercase; }
    .footer-cta-row { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 24px; opacity: 0; transition: opacity 0.5s ease-out 0.5s; }
    .scene.active .footer-cta-row { opacity: 1; }
    .footer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
    .footer-cta-row .cta-mini { background: var(--brand); color: #fff; font-size: 22px; font-weight: 700; padding: 14px 40px; border-radius: 50px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="pulse" id="pulse"></div>
  <div class="topic" id="topic"></div>
  <div class="stage" id="stage"></div>
  <script src="_engine.js"></script>
  <script src="illustrations/icons.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    E.init();
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    E.applyBrand(data.brand || {});
    document.getElementById('topic').textContent = data.topic;
    if (isDeterministic) E.freezeTransitions();

    const stage = document.getElementById('stage');
    const sceneEls = E.buildStage(stage, data.scenes, (s, i) => {
      const iconCue = (s.visual_cues || []).find((c) => c.type === 'icon');
      const iconName = (iconCue && iconCue.name) || s.icon || 'rocket';
      const iconSize = (iconCue && iconCue.size) || 220;
      const isLast = i === data.scenes.length - 1;
      const iconHolder = document.createElement('div');
      iconHolder.appendChild(E.renderIcon(iconName, { size: iconSize, color: 'var(--brand)' }));
      const iconSvg = iconHolder.innerHTML;
      // Optional stats row
      let statsHtml = '';
      if (s.stats && typeof s.stats === 'object') {
        const items = Object.entries(s.stats);
        statsHtml = `<div class="stat-row">${items.map(([k, v]) =>
          `<div class="stat"><div class="stat-num">${E.escapeHtml(String(v))}</div><div class="stat-lbl">${E.escapeHtml(k)}</div></div>`
        ).join('')}</div>`;
      }
      return `
        <div class="hero">
          <div class="pulse-ring"></div>
          <div class="pulse-ring r2"></div>
          <div class="icon-bubble">${iconSvg}</div>
        </div>
        <div class="heading">${E.escapeHtml(s.heading || '')}</div>
        <div class="on-screen">${E.escapeHtml(s.on_screen_text || '')}</div>
        <div class="voiceover">${E.escapeHtml(s.voiceover || '')}</div>
        ${statsHtml}
        ${isLast ? '<div class="footer-cta-row"><div class="footer-dot"></div><div class="cta-mini">LEARN MORE →</div><div class="footer-dot"></div></div>' : ''}
      `;
    });

    // Particles background.
    E.applyDecoration(document.body, { particles: { count: 28, colors: ['var(--brand)', 'var(--accent)', '#ffffff'] } });

    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;
    if (isRender && !isDeterministic) {
      const t0Start = performance.now();
      const sizes = [1200, 800, 1000, 600, 1100];
      const pulse = document.getElementById('pulse');
      const origSeek = seek;
      const seekWithPulse = (tMs) => {
        const r = origSeek(tMs);
        if (r.activeIdx !== undefined) {
          const sz = sizes[r.activeIdx % sizes.length];
          pulse.style.width = pulse.style.height = sz + 'px';
          pulse.style.margin = (-sz/2) + 'px 0 0 ' + (-sz/2) + 'px';
          if (r.activeIdx === 0) document.getElementById('topic').classList.add('show');
          if (tMs >= r.totalMs - 600) document.getElementById('topic').classList.remove('show');
        }
        return r;
      };
      window.__seek = seekWithPulse;
      E.runRealtime(seekWithPulse, timeline.totalMs, () => {
        window.__t0_offset_ms = performance.now() - t0Start;
        window.__renderDone = true;
      });
    } else if (!isRender) {
      // Local preview.
      const t0Start = performance.now();
      function tick() {
        const t = performance.now() - t0Start;
        if (t >= timeline.totalMs) return;
        seek(t);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
  }
  main();
  </script>
</body>
</html>
