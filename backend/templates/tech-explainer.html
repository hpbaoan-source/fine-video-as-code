<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tech Explainer — fine-video-as-code</title>
<style>
  :root {
    --brand: #3B82F6;
    --accent: #F59E0B;
    --text: #FFFFFF;
    --dim: #D1D5DB;
    --bg: #0a0c10;
    --card: rgba(15,17,21,0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  body { position: relative; }
  .stage { position: absolute; inset: 0; }
  .topic { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 8px; color: var(--accent); text-transform: uppercase; font-weight: 600; opacity: 0; transition: opacity 0.5s; z-index: 10; }
  .topic.show { opacity: 1; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
  .scene.active { opacity: 1; }
  .scene.exiting { opacity: 0; }
  .heading { font-size: 110px; font-weight: 800; line-height: 1.05; text-align: center; max-width: 1700px; opacity: 0; transform: scale(0.85); transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .voiceover { font-size: 40px; color: var(--dim); margin-top: 40px; text-align: center; max-width: 1500px; line-height: 1.5; opacity: 0; transition: opacity 0.5s ease-out 0.2s; }
  .on-screen { font-size: 56px; color: var(--brand); margin-top: 24px; font-weight: 700; text-align: center; opacity: 0; transition: opacity 0.5s ease-out 0.4s; }
  .scene.active .heading { opacity: 1; transform: scale(1); }
  .scene.active .voiceover { opacity: 1; }
  .scene.active .on-screen { opacity: 1; }
  .cue { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); max-width: 1500px; opacity: 0; transition: opacity 0.4s ease-out 0.3s; }
  .scene.active .cue { opacity: 1; }
  .cue-icon { width: 200px; height: 200px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 100px; color: #fff; font-weight: 800; }
</style>
</head>
<body>
  <div class="topic" id="topic"></div>
  <div class="stage" id="stage"></div>
  <script src="_engine.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    E.applyBrand(data.brand || {});
    document.getElementById('topic').textContent = data.topic;
    const stage = document.getElementById('stage');
    // In deterministic mode, kill CSS transitions and animations
    // so `__seek(t)` takes effect on the very next paint — that's
    // what makes the output bit-for-bit reproducible. In realtime
    // mode we keep transitions for smooth playback.
    if (isDeterministic) E.freezeTransitions();
    const sceneEls = E.buildStage(stage, data.scenes, (s, i) => {
      const cue = (s.visual_cues || []).find((c) => c.type === 'icon') || (s.visual_cues || [])[0];
      const cueHtml = cue ? `<div class="cue"><div class="cue-icon">${E.escapeHtml((cue.content||'').slice(0,2).toUpperCase())}</div></div>` : '';
      return `
        <div class="heading">${E.escapeHtml(s.heading || '')}</div>
        <div class="on-screen">${E.escapeHtml(s.on_screen_text || '')}</div>
        <div class="voiceover">${E.escapeHtml(s.voiceover || '')}</div>
        ${cueHtml}
      `;
    });
    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;
    if (isRender && !isDeterministic) {
      E.runRealtime(seek, timeline.totalMs, () => {
        window.__t0_offset_ms = performance.now() - t0Start;
        window.__renderDone = true;
      });
      const t0Start = performance.now();
    }
  }
  main();
  </script>
</body>
</html>
