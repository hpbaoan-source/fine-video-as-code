<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech Explainer — fine-video-as-code</title>
  <style>
    /* Template skin. Layout, timing and motion live in _engine.js —
       a template only decides colours, type and decoration. */
    .fv-heading {
      background: linear-gradient(100deg, #ffffff 18%, var(--fv-brand));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .fv-hero-icon { box-shadow: 0 0 80px var(--fv-brand-soft); }
    .fv-hero svg { filter: drop-shadow(0 0 28px var(--fv-brand-soft)); }
    .te-glow {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 520px at 78% 38%, var(--fv-brand-soft) 0%, transparent 70%),
        radial-gradient(700px 420px at 12% 88%, var(--fv-accent-soft) 0%, transparent 70%);
    }
    .te-rule {
      position: absolute; left: var(--fv-safe-x); top: calc(var(--fv-safe-y) + 44px);
      width: 120px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, var(--fv-brand), transparent);
    }
    .te-foot {
      position: absolute; right: var(--fv-safe-x); bottom: calc(var(--fv-subbar-min) + 18px);
      font-size: var(--fv-text-xs); letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--fv-text-faint);
    }
  </style>
</head>
<body>
  <div class="te-glow"></div>
  <div class="te-rule"></div>
  <div class="fv-stage" id="stage"></div>
  <script src="_engine.js"></script>
  <script src="illustrations/icons.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    E.init();
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    document.documentElement.lang = data.language === 'en' ? 'en' : 'vi';
    E.applyBrand(data.brand || {});
    if (isDeterministic) E.freezeTransitions();

    const stage = document.getElementById('stage');
    const sceneEls = E.buildStage(stage, data.scenes, (s, i, total) =>
      E.renderScene(s, i, total, { meta: data, template: 'tech-explainer' })
    );

    E.applyDecoration(document.body, {
      particles: { count: 24, colors: ['var(--fv-brand)', 'var(--fv-accent)', '#ffffff'] },
    });

    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;

    if (isRender && !isDeterministic) {
      E.runRealtime(seek, timeline.totalMs, () => { window.__renderDone = true; });
    } else if (!isRender && !isDeterministic) {
      const t0 = performance.now();
      (function tick() {
        const t = performance.now() - t0;
        if (t >= timeline.totalMs) return;
        seek(t);
        requestAnimationFrame(tick);
      })();
    }
  }
  main();
  </script>
</body>
</html>
