<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech Explainer — fine-video-as-code</title>
  <style>
    :root {
      --brand: #3B82F6;
      --accent: #F59E0B;
      --text: #FFFFFF;
      --dim: #D1D5DB;
      --bg: #0a0c10;
      --card: rgba(15,17,21,0.95);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    body { position: relative; }
    .topic { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 24px; letter-spacing: 10px; color: var(--accent); text-transform: uppercase; font-weight: 600; opacity: 0; transition: opacity 0.5s; z-index: 10; }
    .topic.show { opacity: 1; }
    .stage { position: absolute; inset: 0; }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
    .scene.active { opacity: 1; }
    .scene.exiting { opacity: 0; }
    .scene-num { position: absolute; top: 60px; right: 80px; font-size: 28px; color: var(--dim); font-family: 'JetBrains Mono', monospace; opacity: 0.6; z-index: 5; }
    .scene-num strong { color: var(--brand); font-size: 64px; font-weight: 800; margin-right: 12px; }
    .icon-wrap { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%); display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
    .icon-wrap svg { filter: drop-shadow(0 0 32px rgba(59,130,246,0.6)); }
    .pulse-ring { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px solid var(--brand); animation: pulse-ring 2.2s ease-out infinite; opacity: 0; }
    .heading { font-size: 96px; font-weight: 800; line-height: 1.05; text-align: center; max-width: 1600px; opacity: 0; transform: scale(0.85); transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); margin-top: 0; }
    .voiceover { font-size: 36px; color: var(--dim); margin-top: 36px; text-align: center; max-width: 1400px; line-height: 1.5; opacity: 0; transition: opacity 0.5s ease-out 0.2s; }
    .on-screen { font-size: 52px; color: var(--brand); margin-top: 24px; font-weight: 700; text-align: center; opacity: 0; transition: opacity 0.5s ease-out 0.4s; }
    .scene.active .heading { opacity: 1; transform: scale(1); }
    .scene.active .voiceover { opacity: 1; }
    .scene.active .on-screen { opacity: 1; }
    .scene.active .icon-wrap { animation: glow 3s ease-in-out infinite; }
    .scene.active .pulse-ring { opacity: 0.5; }
    .decor-line { position: absolute; width: 200px; height: 2px; background: linear-gradient(90deg, transparent, var(--brand), transparent); }
    .decor-line.left { left: 100px; top: 50%; opacity: 0.4; }
    .decor-line.right { right: 100px; top: 50%; opacity: 0.4; }
    .footer-line { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--brand), var(--accent), var(--brand)); }
  </style>
</head>
<body>
  <div class="topic" id="topic"></div>
  <div class="stage" id="stage"></div>
  <div class="footer-line"></div>
  <script src="_engine.js"></script>
  <script src="illustrations/icons.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    E.init();
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    E.applyBrand(data.brand || {});
    document.getElementById('topic').textContent = data.topic;
    if (isDeterministic) E.freezeTransitions();

    const stage = document.getElementById('stage');
    const sceneEls = E.buildStage(stage, data.scenes, (s, i, total) => {
      const iconCue = (s.visual_cues || []).find((c) => c.type === 'icon');
      const iconName = (iconCue && iconCue.name) || s.icon || 'lightbulb';
      const iconSize = (iconCue && iconCue.size) || 180;
      // Build a temp container for the icon so we can inject it.
      const iconHolder = document.createElement('div');
      iconHolder.appendChild(E.renderIcon(iconName, { size: iconSize, color: 'var(--brand)' }));
      const iconSvg = iconHolder.innerHTML;
      return `
        <div class="scene-num"><strong>${String(i + 1).padStart(2, '0')}</strong>/ ${String(total).padStart(2, '0')}</div>
        <div class="decor-line left"></div>
        <div class="decor-line right"></div>
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px;">
          <div class="pulse-ring"></div>
          <div class="pulse-ring" style="animation-delay:1.1s"></div>
          <div class="icon-wrap">${iconSvg}</div>
        </div>
        <div class="heading">${E.escapeHtml(s.heading || '')}</div>
        <div class="on-screen">${E.escapeHtml(s.on_screen_text || '')}</div>
        <div class="voiceover">${E.escapeHtml(s.voiceover || '')}</div>
      `;
    });

    // Particles background on the body (under all scenes).
    E.applyDecoration(document.body, { particles: { count: 24, colors: ['var(--brand)', 'var(--accent)', '#ffffff'] } });

    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;
    if (isRender && !isDeterministic) {
      const t0Start = performance.now();
      E.runRealtime(seek, timeline.totalMs, () => {
        window.__t0_offset_ms = performance.now() - t0Start;
        window.__renderDone = true;
      });
    } else if (!isRender) {
      // Local preview mode: drive the seek from a requestAnimationFrame loop.
      const t0Start = performance.now();
      function tick() {
        const t = performance.now() - t0Start;
        if (t >= timeline.totalMs) return;
        seek(t);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
  }
  main();
  </script>
</body>
</html>
