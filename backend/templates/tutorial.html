<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tutorial — fine-video-as-code</title>
  <style>
    /* Template skin. Layout, timing and motion live in _engine.js. */
    .tu-card {
      background: var(--fv-surface); border: 1px solid var(--fv-border);
      border-radius: var(--fv-radius-lg); padding: var(--fv-space-6);
      display: flex; flex-direction: column; gap: var(--fv-space-5);
      backdrop-filter: blur(2px);
    }
    .tu-step {
      display: flex; gap: 18px; align-items: flex-start;
      font-size: var(--fv-text-lg); line-height: 1.4;
    }
    .tu-step-num {
      flex: none; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--fv-font-mono); font-size: var(--fv-text-sm); font-weight: 700;
      color: var(--fv-bg); background: var(--fv-brand);
    }
    .tu-terminal {
      font-family: var(--fv-font-mono); font-size: var(--fv-text-sm); line-height: 1.65;
      background: #0d1117; border: 1px solid var(--fv-border); border-radius: var(--fv-radius-md);
      padding: 18px 22px; white-space: pre; overflow: hidden; color: var(--fv-text-muted);
    }
    .tu-terminal .prompt { color: var(--fv-code-cmd); }
    .tu-terminal .hl { color: var(--fv-text); }
    .tu-terminal .output { color: var(--fv-text-faint); }
    .tu-label {
      font-size: var(--fv-text-xs); letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--fv-text-faint);
    }
  </style>
</head>
<body>
  <div class="fv-stage" id="stage"></div>
  <script src="_engine.js"></script>
  <script src="illustrations/icons.js"></script>
  <script>
  async function main() {
    const E = window.fineVideoEngine;
    E.init();
    const params = new URLSearchParams(location.search);
    const isRender = params.get('render') === '1';
    const isDeterministic = params.get('deterministic') === '1';
    const data = await (await fetch(params.get('data') || 'data.json')).json();
    document.documentElement.lang = data.language === 'en' ? 'en' : 'vi';
    E.applyBrand(data.brand || {});
    if (isDeterministic) E.freezeTransitions();

    const stage = document.getElementById('stage');
    const sceneEls = E.buildStage(stage, data.scenes, (s, i, total) =>
      E.renderScene(s, i, total, { meta: data, template: 'tutorial' })
    );

    E.applyDecoration(document.body, {
      particles: { count: 16, colors: ['var(--fv-brand)', 'var(--fv-accent)'] },
    });

    const timeline = E.buildTimeline(data.scenes);
    const seek = E.makeSeeker(sceneEls, timeline, data.scenes);
    window.__seek = seek;
    window.__duration = () => timeline.totalMs;

    if (isRender && !isDeterministic) {
      E.runRealtime(seek, timeline.totalMs, () => { window.__renderDone = true; });
    } else if (!isRender && !isDeterministic) {
      const t0 = performance.now();
      (function tick() {
        const t = performance.now() - t0;
        if (t >= timeline.totalMs) return;
        seek(t);
        requestAnimationFrame(tick);
      })();
    }
  }
  main();
  </script>
</body>
</html>
